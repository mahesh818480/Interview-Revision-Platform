<header class="navbar" [class.scrolled]="isScrolled">
    <div class="container">
        <div class="logo" routerLink="/">
            <span class="logo-icon">🧠</span>
            <div>
                <h2>Interview<span class="text-red-600">Hub</span></h2>
                <p>Practice • Learn • Crack Interviews</p>
            </div>
        </div>
        <button class="menu-btn" (click)="toggleMenu()">
            <i class="fa-solid" [ngClass]="isMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
        </button>
        <nav [class.show]="isMenuOpen">
            <a (click)="isMenuOpen=false" routerLink="/" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact:true}">
                Dashboard
            </a>

            <a (click)="isMenuOpen=false" routerLink="/questions" routerLinkActive="active">
                Questions
            </a>

            <a (click)="isMenuOpen=false" routerLink="/companies" routerLinkActive="active">
                Companies
            </a>

            <a (click)="isMenuOpen=false" routerLink="/quiz" routerLinkActive="active">
                Quiz
            </a>
        </nav>
    </div>
</header>
