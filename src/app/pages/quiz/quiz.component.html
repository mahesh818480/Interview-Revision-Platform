<section class="min-h-screen bg-slate-50 py-14">
    <div class="max-w-2xl mx-auto px-6">
        <div class="bg-white rounded-2xl shadow-lg p-10">
            <div class="text-center">
                <i class="fa-solid fa-graduation-cap text-6xl text-red-500"></i>
                <h1 class="text-4xl font-bold mt-6">Frontend Interview Quiz</h1>
                <p class="text-gray-500 mt-3">
                    Test your frontend interview preparation with real interview questions.</p>

            </div>
            <div class="mt-10">
                <label class="block mb-2 text-lg font-semibold text-slate-700">Technology</label>
                <select [(ngModel)]="selectedTechnology" class="quiz-select">
                    @for(item of technologies;track item){
                    <option>{{item}}</option>
                    }
                </select>
            </div>
            <div class="mt-6">
                <label class="block mb-2 text-lg font-semibold text-slate-700">Number of Questions</label>
                <select [(ngModel)]="questionCount" class="quiz-select">
                    @for(item of questionCounts;track item){
                    <option [value]="item">{{item}} Questions</option>
                    }
                </select>
            </div>
            <div class="mt-6">
                <label class="block mb-2 text-lg font-semibold text-slate-700">Difficulty</label>
                <select [(ngModel)]="difficulty" class="quiz-select">
                    @for(item of difficulties;track item){
                    <option>{{item}}</option>
                    }
                </select>
            </div>
            <div class="mt-8 rounded-xl bg-red-50 border border-red-200 p-5">
                <h3 class="font-semibold text-red-600">Quiz Instructions</h3>
                <ul class="mt-3 text-gray-600 space-y-2 list-disc ml-5">
                    <li>No negative marking.</li>
                    <li>Questions are selected randomly.</li>
                    <li>Result will be displayed immediately.</li>
                    <li>You can restart the quiz anytime.</li>
                </ul>
            </div>
            <button (click)="startQuiz()" class="start-btn">
                <i class="fa-solid fa-play mr-2"></i>Start Quiz</button>
        </div>
    </div>
</section>
